</style></head><body>
<div id="tr"></div><div class="gn"></div>
<div class="hd"><button id="cn" data-a="menu" title="Saari scenes dekh"></button><div class="pg"><i id="pb"></i></div><button id="bm" class="pl" data-a="mus" title="Gaana on/off">🔇</button><button id="bx" data-a="sfx" title="Awaaz on/off">🔔</button></div>

<script>

let cur=0,sl=[],S=[],H={},AC,mus=0,sfxOn=1,mt;

function tone(f,d=.2,ty='sine',v=.07,t0=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.state=='suspended'&&AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const FX={open:[[523,.15],[784,.3]],click:[[660,.08]],blow:[[320,.25,'triangle'],[210,.3,'triangle']],pop:[[880,.1],[1175,.2]],no:[[150,.3,'square']]};

const MEL=[523,659,784,659,880,784,659,587,523,659,784,1047,880,784,659,587];
function cf(){for(let i=0;i<46;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${C[i%6]};--x:${Math.random()*80-40}px;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;document.body.append(e);setTimeout(()=>e.remove(),5000)}}
/* slides */
add('y',`<div class="in"><p class="hw">Ek bahut important website ban rahi hai...</p><div class="ld"><i id="lb"></i></div><b id="lp">0%</b><p class="hw" id="lt"></p></div>`);
add('y',`<div class="in"><div class="r"><div class="cn"><i></i></div></div><h1 class="r">AAJ KISI KA BIRTHDAY HAI...</h1><p class="hw r">Aur unfortunately, woh tu hai. 😭</p><div class="nm r" data-d="2.6">${Z.n.toUpperCase()}</div><p class="hw r" data-d="3.2">aka ${Z.k} 🦒</p><p class="sm r" data-d="3.6">Ek chhota sa surprise hai tere liye. Din bhar sabki wishes aayi hongi, ye meri taraf se aaj ki LAST wish hai. Zyada emotional mat ho jaana.</p><button class="b r" data-d="3.9" data-a="next">CHAL AB ANDAR AA →</button></div>`);
add('bu',`<div class="in"><div class="stp r">WARNING</div><h2 class="r">Ek zaroori warning.</h2><p class="r">Is website mein tujhe unnecessarily roast kiya jaayega, thoda appreciate bhi kiya jaayega aur beech-beech mein emotional damage bhi ho sakta hai.</p><button class="b r" data-a="next">RISK LENE KO TAIYAAR HOON.</button></div>`);
add('sp',`<div class="in"><p class="hw r">Introducing:</p><h2 class="r">A very special headache.</h2><dl class="pf r">${[['Naam',`${Z.n} (aka ${Z.k} 🦒)`],['Profession','Professional Rage Baiter.'],['Special skill','Bauni ko irritate karna.'],['Part-time job','Reel distributor.'],['Personality','Unpredictable.'],['Common sense','Last seen missing.']].map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div>`);
add('bs',`<div class="in"><p class="hw r">Waise ek baat hai...</p><div class="big">BAUNIIIIIIII.</div><p class="r" data-d="1.8">Tu mujhe jitni baar bauni bolta hai na, main utni baar irritate hone ka drama karti hoon.</p><p class="hw r" data-d="2.4">Par honestly, cute lagta hai. Bas ye baat kisi ko batana mat.</p></div>`);
add('pw',`<div class="in"><h2 class="r">Welcome to the museum of your nonsense.</h2><div class="gal">${['Bina wajah irritate karna.','Har baat mein rage bait karna.','Random pagal harkatein.','Khud hi bakchodi karke innocent banna.','Bauni ko pareshan karna.'].map((x,i)=>`<div class="fr r" style="--rt:${[-2,1.5,-1,2,-1][i]}deg"><small>EXHIBIT ${'ABCDE'[i]}</small>${x}</div>`).join('')}</div><p class="hw r">Ek insaan mein itni saari qualities. Kamaal hai.</p></div>`);
add('ch',`<div class="in"><p class="hw r">Is saal ka sabse bada award jaata hai...</p><div class="r"><div class="tro">🏆</div></div><h2 class="r">BEST RAGE BAITER OF THE YEAR.</h2><p class="hw r">${Z.n} 🦒</p><div class="sc r">${[['Annoying skills',100],['Rage baiting',100],['Randomness',100],['Normal behaviour',0]].map(([a,v])=>`<span>${a}</span><b>${v}/100</b><u style="--w:${v}%"></u>`).join('')}</div></div>`);
add('sb',`<div class="in"><h2 class="r">Ek department tere naam.</h2><div class="rp r">${[['Department','Reel Distribution Department'],['Employee',Z.n],['Designation','Permanent Reel Supplier'],['Performance','Outstanding'],['Employment status','Lifetime']].map(([a,b])=>`<div>${a}<b>${b}</b></div>`).join('')}</div><p class="hw r">Is department se resignation allowed nahi hai.</p><div class="nt r">🎬 ${Z.k} ne ek reel bheji.</div><div class="nt r">🎬 ${Z.k} ne ek aur reel bheji.</div><div class="nt r">${Z.k} is typing... 😭</div></div>`);
add('iv',`<div class="in"><h2 class="r">Kaise shuru hui ye bakchodi?</h2><ol class="tl">${['Pehli mulaqat.','Pehli conversations.','Random college interactions.','Bauni era ki shuruaat.','Rage baiting ka regular programme.','Aur ab ye birthday website.'].map(x=>`<li class="r">${x}</li>`).join('')}</ol></div>`);
add('ch',`<div class="in"><h2 class="r">Bas itna hi time hua hai?</h2><div class="vb r" style="color:var(--by)">2–3 mahine.</div><p class="r">Abhi toh bas 2-3 mahine hue hain, but funny hai ki tu college ke un logon mein aa gaya hai jinke saath baat karna genuinely achha lagta hai.</p></div>`);
add('bu',`<div class="in"><h2 class="r">Teri kuch khaas qualities.</h2><div style="display:grid;gap:10px;width:100%">${['Har situation mein mujhe irritate karne ka talent.','Bina matlab ke reels bhejna.','Random conversations start karna.','Apni harkaton se khud hi entertainment provide karna.','Kabhi normal behave na karna.'].map((x,i)=>`<div class="kd r" style="--rt:${[-1.5,1,-.5,1.5,-1][i]}deg">${x}</div>`).join('')}</div><p class="hw r">Honestly, tere jaisa specimen roz nahi milta.</p></div>`);
add('pw',`<div class="in"><h2 class="r">Official Friendship Report.</h2><div class="rp r">${[['Entertainment','Excellent'],['Annoyance','Outstanding'],['Reel delivery','Exceptional'],['Common sense','Under review'],['Friendship potential','Unlimited'],['Final grade','A+ (Unfortunately)']].map(([a,b])=>`<div>${a}<b>${b}</b></div>`).join('')}<span class="stp">PASSED</span></div></div>`);

/* hooks */
H[0]=()=>{let n=0;const t=setInterval(()=>{if(cur)return clearInterval(t);n=Math.min(100,n+2+Math.random()*5);$('#lb').style.width=n+'%';$('#lp').textContent=Math.floor(n)+'%';if(n>=100){clearInterval(t);$('#lt').textContent='Bas aa hi gayi. Thoda sabr bhi nahi hai kya?';setTimeout(()=>cur==0&&go(1),1600)}},90)};

G.reel=b=>{const a=$('#ra');let sc=0,t=15;b.disabled=true;a.innerHTML='';$('#rr').textContent='';const up=()=>{$('#rs').textContent='Score: '+sc;$('#rt').textContent=t+'s'};up();const sp=setInterval(()=>{if(cur!=12||t<=0)return;const bad=Math.random()<.25,e=document.createElement('button');e.className='fi';e.textContent=bad?'🚫':'🎬';e.style.cssText=`left:${Math.random()*80+3}%;animation-duration:${1.6+Math.random()*1.2}s`;e.onclick=()=>{sc+=bad?-2:1;sx(bad?'no':'click');e.remove();up()};e.onanimationend=()=>e.remove();a.append(e)},480);const tm=setInterval(()=>{t--;up();if(t<=0||cur!=12){clearInterval(tm);clearInterval(sp);a.innerHTML='';b.disabled=false;b.textContent='PHIR SE';$('#rr').textContent=sc<5?'Bas itni? Reel supplier hoke reel pakadna nahi aata? 😭':sc<12?'Theek hai, chalega. Employee of the month nahi, par fired bhi nahi.':'Pro level! Reel Department ka Employee of the Month tu hi hai. 🏆';if(t<=0&&sc>=12)cf()}},1000)};

/* engine */
function render(){$('#tr').innerHTML=S.map(([t,h,d])=>`<section class="s ${t}" ${d?`data-st="${d}"`:''}>${h}</section>`).join('');sl=[...$('#tr').children];sl.forEach(el=>el.querySelectorAll('.r').forEach((e,i)=>e.style.setProperty('--d',(e.dataset.d||(.15+i*(el.dataset.st||.3)))+'s')))}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,s=sl[cur];
if(a=='next'){sx('click');go(cur+1)}else if(a=='prev')go(cur-1);
else if(a=='go'){$('#mn').classList.remove('on');go(i)}

else if(a=='mus'){mus=!mus;b.textContent=mus?'🎵':'🔇';b.classList.remove('pl');clearInterval(mt);if(mus){let k=0;mt=setInterval(()=>{tone(MEL[k%16],1,'triangle',.04);k%4==0&&tone(MEL[k%16]/2,1.4,'sine',.05);k++},430)}}
else if(a=='sfx'){sfxOn=!sfxOn;b.textContent=sfxOn?'🔔':'🔕'}
else if(a=='env'){s.querySelector('.ev').classList.add('open');s.querySelector('.em').classList.add('sh');b.disabled=true;b.textContent='KHUL GAYA ✉️';sx('open')}

else if(a=='cd'){b.classList.add('off');sx('blow');chk()}

else if(a=='pw'){const v=$('#pi').value.trim().toUpperCase();if(v=='BAUNI'){$('#lk').style.display='none';const o=$('#sx');o.parentElement.style.display='grid';sx('open');let k=0;const t=setInterval(()=>{k+=2;o.textContent=SEC.slice(0,k);if(k>=SEC.length)clearInterval(t)},25)}else{sx('no');const m=$('#pe');m.textContent='Nope. Soch, tu mujhe kya bolta hai? 😤';m.classList.remove('sk');void m.offsetWidth;m.classList.add('sk')}}
else if(a=='replay'){render();go(0)}});
document.addEventListener('change',e=>{if(e.target.matches('.ck')){const s=sl[cur],ok=[...s.querySelectorAll('.ck')].every(c=>c.checked),g=s.querySelector('[data-a=sign]');g.disabled=!ok;g.textContent=ok?'SIGN KAR ✍️':'Pehle sab tick kar...';sx('click')}});

let tx,ty;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
